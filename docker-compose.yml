version: '3.9'

services:
  web:
    build: .
    container_name: devops-web
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      - APP_VERSION=1.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3